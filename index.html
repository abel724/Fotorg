<!DOCTYPE html>
<html lang="it">
<head>
<link rel="icon" type="image/png" href="iconaFotorg.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FOTORG</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f5f5">
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f5f5;
        text-align: center;
    }

    h1 {
        margin-bottom: 5px;
    }

    p {
        margin-top: 0;
        margin-bottom: 25px;
    }

    .galleria {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        max-width: 1200px;
        margin: auto;
    }

    .galleria img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .galleria img:hover {
        transform: scale(1.03);
    }
@media (max-width: 600px) {
    .galleria {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
    }

    .galleria img {
        height: 110px;
    }
}
</style>
</head>

<body>

<h1>FOTORG</h1>
<p>Archivio fotografico ORG</p>
<div style="margin-bottom:60px;">
    <input
        type="text"
        id="campoRicerca"
        placeholder="Cerca per nome, evento o codice foto..."
        style="
            width:80%;
            max-width:600px;
            padding:16px;
            font-size:20px;
            border:1px solid #ccc;
            border-radius:8px;
            box-sizing:border-box;
        "
    >
</div>

<div class="galleria" id="galleria">
</div>

<script>
const galleria = document.getElementById("galleria");

for (let i = 1; i <= 75 ; i++) {

    const numero = String(i).padStart(3, "0");
    const codice = "F" + numero;

    const img = document.createElement("img");

    img.src = "FotoArchivio/" + codice + ".jpg";
    img.alt = "Foto " + codice;
    img.title = codice;

    img.onerror = function() {
        img.remove();
    };

    galleria.appendChild(img);
}
</script>    
</div>    
<div id="modal" style="
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.90);
    align-items:center;
    justify-content:center;
    overflow:auto;
">

    <span id="chiudi" style="
        position:absolute;
        top:15px;
        right:25px;
        color:white;
        font-size:40px;
        font-weight:bold;
        cursor:pointer;
    ">&times;</span>

    <div style="
        width:90%;
        max-width:900px;
        text-align:center;
        color:white;
        padding:30px 10px;
    ">

        <div id="nomeFoto" style="
            font-size:24px;
            font-weight:bold;
            margin-bottom:15px;     
            color:white;

        "></div>

        <img id="fotoIngrandita" src="" style="
            max-width:100%;
            max-height:65vh;
            object-fit:contain;
            border-radius:8px;
        ">

<div id="eventoFoto" style="
    font-size:18px;
    margin-top:15px;
    margin-bottom:20px;
"></div>
<div id="personeFoto" style="
    font-size:17px;
    line-height:1.6;
"></div>
<div id="areaAdmin" style="
    display:none;
    margin-top:25px;
    color:white;
">

    <div style="margin-bottom:12px;">
        <label>Evento:</label><br>
        <input id="eventoModifica" type="text"
            style="width:90%; max-width:700px; font-size:17px; padding:8px;">
    </div>
<button id="salvaDati" style="
        font-size:17px;
        padding:8px 20px;
        cursor:pointer;
    ">Salva</button>

</div>

    </div>
</div>

<script src="dati.js"></script>
<script> 
const immagini = Array.from(document.querySelectorAll(".galleria img"));
let fotoNavigazione = immagini;
    let indiceFoto = 0;
    let toccoInizioX = 0;
    let toccoFineX = 0;
    const modal = document.getElementById("modal");
     
    const fotoIngrandita = document.getElementById("fotoIngrandita");
   
    fotoIngrandita.addEventListener("touchstart", function(event) {
    toccoInizioX = event.touches[0].clientX;
});

fotoIngrandita.addEventListener("touchend", function(event) {
    toccoFineX = event.changedTouches[0].clientX;

if (toccoFineX < toccoInizioX - 50) {
    // Movimento verso sinistra = foto precedente
    mostraFoto(indiceFoto + 1);
}

if (toccoFineX > toccoInizioX + 50) {
    // Movimento verso destra = foto successiva
    mostraFoto(indiceFoto - 1);
}
   
});  
    const chiudi = document.getElementById("chiudi");   
    immagini.forEach(function(immagine) {
        immagine.onclick = function() {
       
        indiceFoto = fotoNavigazione.indexOf(immagine);   
            const nomeFoto = immagine.alt.replace("Foto ", "");
         
            fotoIngrandita.src = immagine.src;

            document.getElementById("nomeFoto").textContent = nomeFoto;

            const dati = datiFoto[nomeFoto];

            if (dati) {
                document.getElementById("eventoFoto").textContent =
                    dati.evento;

                const elenco = document.getElementById("personeFoto");
                elenco.innerHTML = "";

for (let i = 0; i < dati.persone.length; i += 3) {

    const riga = document.createElement("div");
    riga.style.display = "flex";
    riga.style.justifyContent = "center";
    riga.style.gap = "30px";
    riga.style.marginBottom = "8px";

    for (let j = i; j < i + 3 && j < dati.persone.length; j++) {

        const persona = document.createElement("span");
        persona.textContent = dati.persone[j];
        persona.style.minWidth = "180px";

        riga.appendChild(persona);
    }

    elenco.appendChild(riga);
}               

            }

            modal.style.display = "flex";
        };
    });

    chiudi.onclick = function() {
        modal.style.display = "none";
    };

function mostraFoto(indice) {
 
if (indice < 0 || indice >= fotoNavigazione.length) {
    return;
}
indiceFoto = indice;

const immagine = fotoNavigazione[indice];    

const nomeFoto = immagine.alt.replace("Foto ", "");

    fotoIngrandita.src = immagine.src;

    document.getElementById("nomeFoto").textContent = nomeFoto;

    const dati = datiFoto[nomeFoto];

    if (dati) {
        document.getElementById("eventoFoto").textContent = dati.evento;

        const elenco = document.getElementById("personeFoto");
        elenco.innerHTML = "";

        for (let i = 0; i < dati.persone.length; i += 3) {

            const riga = document.createElement("div");
            riga.style.display = "flex";
            riga.style.justifyContent = "center";
            riga.style.gap = "30px";
            riga.style.marginBottom = "8px";

            for (let j = i; j < i + 3 && j < dati.persone.length; j++) {

                const persona = document.createElement("span");
                persona.textContent = dati.persone[j];
                persona.style.minWidth = "180px";

                riga.appendChild(persona);
            }

            elenco.appendChild(riga);
        }
    }
}

document.addEventListener("keydown", function(event) {

    if (modal.style.display !== "flex") {
        return;
    }

    if (event.key === "ArrowRight") {
        mostraFoto(indiceFoto + 1);
    }

    if (event.key === "ArrowLeft") {
        mostraFoto(indiceFoto - 1);
    }
});
    modal.onclick = function(event) {
        if (event.target === modal) {
            modal.style.display = "none";
        }
    };
    
</script>

<script>
const campoRicerca = document.getElementById("campoRicerca");

campoRicerca.addEventListener("input", function() {

    const testo = campoRicerca.value.toLowerCase().trim();

    fotoNavigazione = [];

    immagini.forEach(function(immagine) {

        const codice = immagine.alt.replace("Foto ", "");
        const dati = datiFoto[codice];

        if (testo === "") {
            immagine.style.display = "";
            fotoNavigazione.push(immagine);
            return;
        }

        let contenuto = codice.toLowerCase();

        if (dati) {
            contenuto += " " + dati.evento.toLowerCase();
            contenuto += " " + dati.persone.join(" ").toLowerCase();
        }

        if (contenuto.includes(testo)) {
            immagine.style.display = "";
            fotoNavigazione.push(immagine);
        } else {
            immagine.style.display = "none";
        }
    });
});
</script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
