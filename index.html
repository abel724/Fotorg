    <div id="modal" style="
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    align-items:center;
    justify-content:center;
">

    <span id="chiudi" style="
        position:absolute;
        top:15px;
        right:25px;
        color:white;
        font-size:40px;
        font-weight:bold;
        cursor:pointer;
    ">&times;</span>

    <img id="fotoIngrandita" src="" style="
        max-width:95%;
        max-height:90%;
        object-fit:contain;
    ">
</div>

<script>
    const immagini = document.querySelectorAll(".galleria img");
    const modal = document.getElementById("modal");
    const fotoIngrandita = document.getElementById("fotoIngrandita");
    const chiudi = document.getElementById("chiudi");

    immagini.forEach(function(immagine) {
        immagine.onclick = function() {
            fotoIngrandita.src = immagine.src;
            modal.style.display = "flex";
        };
    });

    chiudi.onclick = function() {
        modal.style.display = "none";
    };

    modal.onclick = function(event) {
        if (event.target === modal) {
            modal.style.display = "none";
        }
    };
</script>
