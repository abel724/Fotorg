<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FOTORG</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f5f5;
        text-align: center;
    }

    h1 {
        margin-bottom: 5px;
    }

    p {
        margin-top: 0;
        margin-bottom: 25px;
    }

    .galleria {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 15px;
        max-width: 1200px;
        margin: auto;
    }

    .galleria img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .galleria img:hover {
        transform: scale(1.03);
    }
</style>
</head>

<body>

<h1>FOTORG</h1>

<p>Archivio fotografico ORG</p>

<div class="galleria">

    <img src="FotoArchivio/F001.jpg" alt="Foto F001">
    <img src="FotoArchivio/F002.jpg" alt="Foto F002">
    <img src="FotoArchivio/F003.jpg" alt="Foto F003">

</div>

</body>
</html>
